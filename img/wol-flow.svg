<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <style>
    text { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
    .title { fill: #f0f6fc; font-size: 22px; font-weight: 700; }
    .label { fill: #f0f6fc; font-size: 13px; font-weight: 600; }
    .sublabel { fill: #8b949e; font-size: 11px; }
    .step-num { fill: #0a0e21; font-size: 14px; font-weight: 700; }
    .arrow-label { fill: #00d4ff; font-size: 10px; font-weight: 600; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e21"/>
      <stop offset="50%" stop-color="#0f1328"/>
      <stop offset="100%" stop-color="#0a0e21"/>
    </linearGradient>
    <radialGradient id="glow-pink" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(255,64,129,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,64,129,0)"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="rgba(0,255,136,0.10)"/>
      <stop offset="100%" stop-color="rgba(0,255,136,0)"/>
    </radialGradient>
    <linearGradient id="grad-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#252b45"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="glow-cyan-f">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00d4ff" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff4081"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.4" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" fill="url(#bg)"/>
  <rect width="960" height="580" fill="url(#grid)" opacity="0.3"/>
  <rect width="960" height="580" fill="url(#glow-pink)"/>
  <rect width="960" height="580" fill="url(#glow-green)"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" class="title">远程唤醒 (WOL) · 流程图</text>
  <line x1="310" y1="52" x2="650" y2="52" stroke="#ff4081" stroke-width="0.5" opacity="0.5"/>

  <!-- Step 1: 手机发送指令 -->
  <rect x="40" y="90" width="170" height="90" rx="12" fill="url(#grad-node)" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="90" width="170" height="4" rx="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="65" cy="118" r="14" fill="#00d4ff"/>
  <text x="65" y="123" text-anchor="middle" class="step-num">1</text>
  <text x="130" y="118" text-anchor="middle" class="label">📱 App 发送</text>
  <text x="130" y="140" text-anchor="middle" class="sublabel">用户点击唤醒按钮</text>
  <text x="130" y="158" text-anchor="middle" class="sublabel">wakeonlan MAC地址</text>

  <!-- Arrow 1->2 -->
  <line x1="210" y1="135" x2="275" y2="135" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan-f)"/>

  <!-- Step 2: SSH 隧道传输 -->
  <rect x="280" y="90" width="170" height="90" rx="12" fill="url(#grad-node)" stroke="#7c4dff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="280" y="90" width="170" height="4" rx="2" fill="#7c4dff" opacity="0.6"/>
  <circle cx="305" cy="118" r="14" fill="#7c4dff"/>
  <text x="305" y="123" text-anchor="middle" class="step-num">2</text>
  <text x="370" y="118" text-anchor="middle" class="label">🔐 SSH 加密</text>
  <text x="370" y="140" text-anchor="middle" class="sublabel">指令通过 SSH 隧道</text>
  <text x="370" y="158" text-anchor="middle" class="sublabel">端到端加密传输</text>

  <!-- Arrow 2->3 -->
  <line x1="450" y1="135" x2="515" y2="135" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan-f)"/>

  <!-- Step 3: 跳板机接收 -->
  <rect x="520" y="90" width="170" height="90" rx="12" fill="url(#grad-node)" stroke="#00ff88" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="520" y="90" width="170" height="4" rx="2" fill="#00ff88" opacity="0.6"/>
  <circle cx="545" cy="118" r="14" fill="#00ff88"/>
  <text x="545" y="123" text-anchor="middle" class="step-num">3</text>
  <text x="610" y="118" text-anchor="middle" class="label" fill="#00ff88">📦 跳板机</text>
  <text x="610" y="140" text-anchor="middle" class="sublabel">解析 WOL 指令</text>
  <text x="610" y="158" text-anchor="middle" class="sublabel">准备发送魔术包</text>

  <!-- Arrow 3->4 -->
  <line x1="690" y1="135" x2="755" y2="135" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan-f)"/>

  <!-- Step 4: 发送 WOL 魔术包 -->
  <rect x="760" y="90" width="160" height="90" rx="12" fill="url(#grad-node)" stroke="#ff4081" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="760" y="90" width="160" height="4" rx="2" fill="#ff4081" opacity="0.6"/>
  <circle cx="785" cy="118" r="14" fill="#ff4081"/>
  <text x="785" y="123" text-anchor="middle" class="step-num">4</text>
  <text x="845" y="118" text-anchor="middle" class="label" fill="#ff4081">📡 WOL 魔术包</text>
  <text x="845" y="140" text-anchor="middle" class="sublabel">UDP 广播到内网</text>
  <text x="845" y="158" text-anchor="middle" class="sublabel">FF:FF:FF:FF:FF:FF</text>

  <!-- Arrow 4->5 (down) -->
  <path d="M 840 180 L 840 230 Q 840 250 820 250 L 520 250 Q 500 250 500 270" fill="none" stroke="#ff4081" stroke-width="2" marker-end="url(#arrow-pink)"/>
  <rect x="620" y="232" width="80" height="18" rx="4" fill="#0a0e21" opacity="0.9"/>
  <text x="660" y="245" text-anchor="middle" fill="#ff4081" font-size="10" font-weight="600">广播魔术包</text>

  <!-- Step 5: NAS 收到信号 -->
  <rect x="360" y="270" width="170" height="90" rx="12" fill="url(#grad-node)" stroke="#00ff88" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="360" y="270" width="170" height="4" rx="2" fill="#00ff88" opacity="0.6"/>
  <circle cx="385" cy="298" r="14" fill="#00ff88"/>
  <text x="385" y="303" text-anchor="middle" class="step-num">5</text>
  <text x="450" y="298" text-anchor="middle" class="label" fill="#00ff88">💾 NAS 启动</text>
  <text x="450" y="320" text-anchor="middle" class="sublabel">网卡收到魔术包</text>
  <text x="450" y="338" text-anchor="middle" class="sublabel">BIOS 唤醒 · 系统启动</text>

  <!-- Arrow 5->6 -->
  <line x1="530" y1="315" x2="595" y2="315" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 6: NAS 上线 -->
  <rect x="600" y="270" width="170" height="90" rx="12" fill="url(#grad-node)" stroke="#00ff88" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="600" y="270" width="170" height="4" rx="2" fill="#00ff88" opacity="0.6"/>
  <circle cx="625" cy="298" r="14" fill="#00ff88"/>
  <text x="625" y="303" text-anchor="middle" class="step-num">6</text>
  <text x="690" y="298" text-anchor="middle" class="label" fill="#00ff88">✅ NAS 上线</text>
  <text x="690" y="320" text-anchor="middle" class="sublabel">获取内网 IP</text>
  <text x="690" y="338" text-anchor="middle" class="sublabel">服务就绪 · 可访问</text>

  <!-- Arrow 6->7 (down-left) -->
  <path d="M 685 360 L 685 400 Q 685 420 665 420 L 300 420 Q 280 420 280 440" fill="none" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="6,3"/>
  <rect x="440" y="402" width="90" height="18" rx="4" fill="#0a0e21" opacity="0.9"/>
  <text x="485" y="415" text-anchor="middle" fill="#00ff88" font-size="10" font-weight="600">状态回传</text>

  <!-- Step 7: 返回状态 -->
  <rect x="140" y="440" width="280" height="80" rx="12" fill="url(#grad-node)" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="140" y="440" width="280" height="4" rx="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="170" cy="472" r="14" fill="#00d4ff"/>
  <text x="170" y="477" text-anchor="middle" class="step-num">7</text>
  <text x="290" y="472" text-anchor="middle" class="label">📱 App 显示结果</text>
  <text x="290" y="495" text-anchor="middle" class="sublabel">"NAS 已成功唤醒，等待启动..."</text>

  <!-- Time indicator -->
  <rect x="500" y="460" width="200" height="60" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="600" y="485" text-anchor="middle" fill="#8b949e" font-size="11">⏱ 全程耗时</text>
  <text x="600" y="508" text-anchor="middle" fill="#00d4ff" font-size="16" font-weight="700">约 30 秒 ~ 2 分钟</text>

  <!-- Legend -->
  <rect x="40" y="545" width="880" height="22" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <circle cx="70" cy="556" r="6" fill="#00d4ff"/>
  <text x="82" y="560" fill="#8b949e" font-size="10">用户操作</text>
  <circle cx="160" cy="556" r="6" fill="#7c4dff"/>
  <text x="172" y="560" fill="#8b949e" font-size="10">SSH 加密</text>
  <circle cx="250" cy="556" r="6" fill="#00ff88"/>
  <text x="262" y="560" fill="#8b949e" font-size="10">内网通信</text>
  <circle cx="340" cy="556" r="6" fill="#ff4081"/>
  <text x="352" y="560" fill="#8b949e" font-size="10">WOL 魔术包</text>
  <text x="820" y="560" fill="#48cae4" font-size="10" opacity="0.6">Wake-on-LAN Flow</text>

</svg>