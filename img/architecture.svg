<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>
    text { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
    .title { fill: #f0f6fc; font-size: 22px; font-weight: 700; }
    .label { fill: #f0f6fc; font-size: 13px; font-weight: 600; }
    .sublabel { fill: #8b949e; font-size: 11px; font-weight: 400; }
    .zone-label { fill: #00d4ff; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
    .arrow-label { fill: #00d4ff; font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e21"/>
      <stop offset="50%" stop-color="#0f1328"/>
      <stop offset="100%" stop-color="#0a0e21"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="25%" cy="35%" r="40%">
      <stop offset="0%" stop-color="rgba(0,212,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,212,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="75%" cy="65%" r="35%">
      <stop offset="0%" stop-color="rgba(124,77,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(124,77,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="85%" r="30%">
      <stop offset="0%" stop-color="rgba(0,255,136,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,255,136,0)"/>
    </radialGradient>
    <linearGradient id="grad-phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#252b45"/>
    </linearGradient>
    <linearGradient id="grad-server" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#1e2d42"/>
    </linearGradient>
    <linearGradient id="grad-device" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#1e3520"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="glow-blue">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00d4ff" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-green-filter">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00ff88" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c4dff"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.4" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" fill="url(#bg)"/>
  <rect width="960" height="620" fill="url(#grid)" opacity="0.4"/>
  <rect width="960" height="620" fill="url(#glow-cyan)"/>
  <rect width="960" height="620" fill="url(#glow-purple)"/>
  <rect width="960" height="620" fill="url(#glow-green)"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" class="title">远程家庭网络管理 · 整体架构</text>
  <line x1="300" y1="52" x2="660" y2="52" stroke="#00d4ff" stroke-width="0.5" opacity="0.5"/>

  <!-- Zone: 公网 (Internet) -->
  <rect x="40" y="70" width="880" height="200" rx="12" fill="rgba(0,212,255,0.04)" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="60" y="95" class="zone-label">☁ 公网 Internet</text>

  <!-- Zone: 家庭内网 -->
  <rect x="40" y="310" width="880" height="270" rx="12" fill="rgba(0,255,136,0.03)" stroke="rgba(0,255,136,0.2)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="60" y="335" class="zone-label" fill="#00ff88">⌂ 家庭内网 LAN</text>

  <!-- Node: 手机 App -->
  <rect x="80" y="120" width="180" height="110" rx="12" fill="url(#grad-phone)" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="120" width="180" height="4" rx="2" fill="#00d4ff" opacity="0.6"/>
  <text x="170" y="160" text-anchor="middle" class="label">📱 家庭管家 App</text>
  <text x="170" y="180" text-anchor="middle" class="sublabel">远程唤醒 · 终端 · 端口转发</text>
  <text x="170" y="198" text-anchor="middle" class="sublabel">SSH 密钥认证</text>

  <!-- Node: SSH Tunnel -->
  <rect x="370" y="120" width="220" height="110" rx="12" fill="url(#grad-phone)" stroke="#7c4dff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="370" y="120" width="220" height="4" rx="2" fill="#7c4dff" opacity="0.6"/>
  <text x="480" y="155" text-anchor="middle" class="label">🔐 SSH 加密隧道</text>
  <text x="480" y="175" text-anchor="middle" class="sublabel">端到端加密 · 公网传输</text>
  <text x="480" y="195" text-anchor="middle" class="sublabel">密钥 + OTP 双因子认证</text>
  <text x="480" y="213" text-anchor="middle" class="sublabel">Fail2ban 入侵防护</text>

  <!-- Node: 公网 IP -->
  <rect x="700" y="120" width="180" height="110" rx="12" fill="url(#grad-phone)" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="120" width="180" height="4" rx="2" fill="#00d4ff" opacity="0.6"/>
  <text x="790" y="155" text-anchor="middle" class="label">🌐 路由器</text>
  <text x="790" y="175" text-anchor="middle" class="sublabel">光猫桥接模式</text>
  <text x="790" y="195" text-anchor="middle" class="sublabel">公网 IP · 端口映射</text>

  <!-- Arrow: App -> SSH Tunnel -->
  <line x1="260" y1="175" x2="365" y2="175" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow-cyan)" filter="url(#glow-blue)"/>
  <rect x="282" y="160" width="62" height="18" rx="4" fill="#0a0e21" opacity="0.9"/>
  <text x="313" y="173" text-anchor="middle" class="arrow-label" font-size="10">SSH 连接</text>

  <!-- Arrow: SSH Tunnel -> Router -->
  <line x1="590" y1="175" x2="695" y2="175" stroke="#7c4dff" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="610" y="160" width="66" height="18" rx="4" fill="#0a0e21" opacity="0.9"/>
  <text x="643" y="173" text-anchor="middle" fill="#7c4dff" font-size="10" font-weight="600">加密流量</text>

  <!-- Arrow: Router -> Jump Server (穿过边界) -->
  <line x1="790" y1="230" x2="480" y2="355" stroke="#00ff88" stroke-width="2.5" marker-end="url(#arrow-green)" filter="url(#glow-green-filter)"/>
  <rect x="600" y="275" width="90" height="18" rx="4" fill="#0a0e21" opacity="0.9"/>
  <text x="645" y="288" text-anchor="middle" fill="#00ff88" font-size="10" font-weight="600">内网穿透</text>

  <!-- Boundary line -->
  <line x1="40" y1="295" x2="920" y2="295" stroke="#00d4ff" stroke-width="1" stroke-dasharray="12,6" opacity="0.4"/>
  <rect x="420" y="285" width="120" height="20" rx="4" fill="#0a0e21"/>
  <text x="480" y="299" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="600" opacity="0.8">🔒 防火墙边界</text>

  <!-- Node: 跳板机 (Armbian) -->
  <rect x="370" y="355" width="220" height="100" rx="12" fill="url(#grad-server)" stroke="#00ff88" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="370" y="355" width="220" height="4" rx="2" fill="#00ff88" opacity="0.6"/>
  <text x="480" y="388" text-anchor="middle" class="label" fill="#00ff88">📦 跳板机 · Armbian</text>
  <text x="480" y="408" text-anchor="middle" class="sublabel">闲置电视盒子 · 2W 功耗</text>
  <text x="480" y="426" text-anchor="middle" class="sublabel">24h 在线 · SSH 服务端</text>
  <text x="480" y="444" text-anchor="middle" class="sublabel">WOL · Docker · 端口转发</text>

  <!-- Node: NAS -->
  <rect x="80" y="490" width="180" height="80" rx="12" fill="url(#grad-device)" stroke="#00ff88" stroke-width="1" filter="url(#shadow)"/>
  <text x="170" y="525" text-anchor="middle" class="label" fill="#00ff88">💾 NAS</text>
  <text x="170" y="545" text-anchor="middle" class="sublabel">群晖 · 飞牛 · 文件存储</text>

  <!-- Node: 电脑 -->
  <rect x="390" y="490" width="180" height="80" rx="12" fill="url(#grad-device)" stroke="#00ff88" stroke-width="1" filter="url(#shadow)"/>
  <text x="480" y="525" text-anchor="middle" class="label" fill="#00ff88">🖥️ 家庭电脑</text>
  <text x="480" y="545" text-anchor="middle" class="sublabel">远程桌面 · SSH</text>

  <!-- Node: 智能家居 -->
  <rect x="700" y="490" width="180" height="80" rx="12" fill="url(#grad-device)" stroke="#00ff88" stroke-width="1" filter="url(#shadow)"/>
  <text x="790" y="525" text-anchor="middle" class="label" fill="#00ff88">🏠 智能家居</text>
  <text x="790" y="545" text-anchor="middle" class="sublabel">HomeAssistant · IoT</text>

  <!-- Arrow: Jump Server -> NAS -->
  <path d="M 420 455 L 420 475 Q 420 485 410 485 L 270 485 Q 260 485 260 495" fill="none" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="6,3"/>

  <!-- Arrow: Jump Server -> PC -->
  <line x1="480" y1="455" x2="480" y2="486" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="6,3"/>

  <!-- Arrow: Jump Server -> Smart Home -->
  <path d="M 540 455 L 540 475 Q 540 485 550 485 L 690 485 Q 700 485 700 495" fill="none" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="6,3"/>

  <!-- Legend -->
  <rect x="40" y="590" width="880" height="22" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <line x1="60" y1="601" x2="100" y2="601" stroke="#00d4ff" stroke-width="2"/>
  <text x="108" y="605" fill="#8b949e" font-size="10">SSH 连接</text>
  <line x1="180" y1="601" x2="220" y2="601" stroke="#7c4dff" stroke-width="2"/>
  <text x="228" y="605" fill="#8b949e" font-size="10">加密流量</text>
  <line x1="300" y1="601" x2="340" y2="601" stroke="#00ff88" stroke-width="2"/>
  <text x="348" y="605" fill="#8b949e" font-size="10">内网通信</text>
  <line x1="430" y1="601" x2="470" y2="601" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="478" y="605" fill="#8b949e" font-size="10">WOL / 端口转发</text>
  <text x="820" y="605" fill="#48cae4" font-size="10" opacity="0.6">HomeManager Architecture</text>

</svg>