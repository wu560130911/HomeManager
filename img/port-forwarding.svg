<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <style>
    text { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
    .title { fill: #f0f6fc; font-size: 22px; font-weight: 700; }
    .label { fill: #f0f6fc; font-size: 13px; font-weight: 600; }
    .sublabel { fill: #8b949e; font-size: 11px; }
    .port { fill: #ff4081; font-size: 14px; font-weight: 700; font-family: "SF Mono", "Menlo", monospace; }
    .arrow-label { fill: #00d4ff; font-size: 10px; font-weight: 600; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e21"/>
      <stop offset="50%" stop-color="#0f1328"/>
      <stop offset="100%" stop-color="#0a0e21"/>
    </linearGradient>
    <radialGradient id="glow-purple" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="rgba(124,77,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(124,77,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="80%" cy="70%" r="30%">
      <stop offset="0%" stop-color="rgba(0,255,136,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,255,136,0)"/>
    </radialGradient>
    <linearGradient id="grad-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#252b45"/>
    </linearGradient>
    <linearGradient id="grad-tunnel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(124,77,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(124,77,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(124,77,255,0.15)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="glow-cyan-f">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00d4ff" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-green-f">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00ff88" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c4dff"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <linearGradient id="tunnel-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(124,77,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(124,77,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#bg)"/>
  <rect width="960" height="520" fill="url(#grid)" opacity="0.3"/>
  <rect width="960" height="520" fill="url(#glow-purple)"/>
  <rect width="960" height="520" fill="url(#glow-green)"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" class="title">端口转发原理 · 安全访问家庭服务</text>
  <line x1="280" y1="52" x2="680" y2="52" stroke="#7c4dff" stroke-width="0.5" opacity="0.5"/>

  <!-- Zone: 手机端 -->
  <rect x="40" y="80" width="200" height="340" rx="12" fill="rgba(0,212,255,0.04)" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="140" y="105" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="600" letter-spacing="2">手机端</text>

  <!-- Zone: SSH 隧道 -->
  <rect x="270" y="80" width="420" height="340" rx="12" fill="url(#tunnel-fill)" stroke="rgba(124,77,255,0.3)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="480" y="105" text-anchor="middle" fill="#7c4dff" font-size="12" font-weight="600" letter-spacing="2">SSH 加密隧道 · 公网</text>

  <!-- Zone: 家庭内网 -->
  <rect x="720" y="80" width="200" height="340" rx="12" fill="rgba(0,255,136,0.03)" stroke="rgba(0,255,136,0.2)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="820" y="105" text-anchor="middle" fill="#00ff88" font-size="12" font-weight="600" letter-spacing="2">家庭内网</text>

  <!-- Node: 浏览器 -->
  <rect x="60" y="140" width="160" height="80" rx="10" fill="url(#grad-node)" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="140" width="160" height="3" rx="1" fill="#00d4ff" opacity="0.6"/>
  <text x="140" y="172" text-anchor="middle" class="label">🌐 浏览器</text>
  <text x="140" y="195" text-anchor="middle" class="port">localhost:5000</text>

  <!-- Arrow: Browser -> Tunnel -->
  <line x1="220" y1="180" x2="295" y2="180" stroke="#00d4ff" stroke-width="2.5" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan-f)"/>
  <rect x="230" y="162" width="56" height="18" rx="4" fill="#0a0e21" opacity="0.9"/>
  <text x="258" y="175" text-anchor="middle" class="arrow-label">HTTP 请求</text>

  <!-- Node: SSH Client -->
  <rect x="300" y="140" width="160" height="80" rx="10" fill="url(#grad-node)" stroke="#7c4dff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="140" width="160" height="3" rx="1" fill="#7c4dff" opacity="0.6"/>
  <text x="380" y="170" text-anchor="middle" class="label" fill="#7c4dff">🔐 SSH 客户端</text>
  <text x="380" y="193" text-anchor="middle" class="sublabel">本地端口监听</text>

  <!-- Encrypted tunnel visual -->
  <rect x="480" y="150" width="180" height="60" rx="8" fill="rgba(124,77,255,0.1)" stroke="rgba(124,77,255,0.3)" stroke-width="1"/>
  <text x="570" y="172" text-anchor="middle" fill="#7c4dff" font-size="11" font-weight="600">🔒 端到端加密</text>
  <text x="570" y="192" text-anchor="middle" fill="#8b949e" font-size="10">AES-256 / ChaCha20</text>

  <!-- Arrow: SSH Client -> Tunnel -->
  <line x1="460" y1="180" x2="475" y2="180" stroke="#7c4dff" stroke-width="2" marker-end="url(#arrow-back)"/>

  <!-- Arrow: Tunnel -> SSH Server -->
  <line x1="660" y1="180" x2="730" y2="180" stroke="#7c4dff" stroke-width="2" marker-end="url(#arrow-back)"/>

  <!-- Node: 跳板机 SSH Server -->
  <rect x="300" y="270" width="160" height="80" rx="10" fill="url(#grad-node)" stroke="#00ff88" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="270" width="160" height="3" rx="1" fill="#00ff88" opacity="0.6"/>
  <text x="380" y="300" text-anchor="middle" class="label" fill="#00ff88">📦 跳板机</text>
  <text x="380" y="320" text-anchor="middle" class="sublabel">SSH Server · 转发</text>
  <text x="380" y="338" text-anchor="middle" class="sublabel">192.168.1.100</text>

  <!-- Arrow: SSH Client -> Jump Server (vertical, encrypted) -->
  <path d="M 380 220 L 380 265" fill="none" stroke="#7c4dff" stroke-width="2" marker-end="url(#arrow-back)" stroke-dasharray="6,3"/>
  <rect x="340" y="232" width="80" height="18" rx="4" fill="#0a0e21" opacity="0.9"/>
  <text x="380" y="245" text-anchor="middle" fill="#7c4dff" font-size="10" font-weight="600">SSH 通道</text>

  <!-- Node: NAS -->
  <rect x="740" y="270" width="160" height="80" rx="10" fill="url(#grad-node)" stroke="#00ff88" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="740" y="270" width="160" height="3" rx="1" fill="#00ff88" opacity="0.6"/>
  <text x="820" y="300" text-anchor="middle" class="label" fill="#00ff88">💾 NAS</text>
  <text x="820" y="320" text-anchor="middle" class="sublabel">Web 管理界面</text>
  <text x="820" y="338" text-anchor="middle" class="port" font-size="12">192.168.1.200:5000</text>

  <!-- Arrow: Jump Server -> NAS (internal) -->
  <line x1="460" y1="310" x2="735" y2="310" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow-green)" filter="url(#glow-green-f)"/>
  <rect x="555" y="292" width="90" height="18" rx="4" fill="#0a0e21" opacity="0.9"/>
  <text x="600" y="305" text-anchor="middle" fill="#00ff88" font-size="10" font-weight="600">内网直连转发</text>

  <!-- Data flow visualization - Request path -->
  <rect x="60" y="380" width="860" height="28" rx="6" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.15)" stroke-width="0.5"/>
  <text x="90" y="399" fill="#00d4ff" font-size="11" font-weight="600">请求路径：</text>
  <text x="165" y="399" fill="#f0f6fc" font-size="11">浏览器</text>
  <text x="210" y="399" fill="#7c4dff" font-size="11">→</text>
  <text x="225" y="399" fill="#f0f6fc" font-size="11">SSH 加密</text>
  <text x="290" y="399" fill="#7c4dff" font-size="11">→</text>
  <text x="305" y="399" fill="#f0f6fc" font-size="11">公网传输</text>
  <text x="370" y="399" fill="#7c4dff" font-size="11">→</text>
  <text x="385" y="399" fill="#f0f6fc" font-size="11">跳板机解密</text>
  <text x="460" y="399" fill="#00ff88" font-size="11">→</text>
  <text x="475" y="399" fill="#f0f6fc" font-size="11">内网转发</text>
  <text x="540" y="399" fill="#00ff88" font-size="11">→</text>
  <text x="555" y="399" fill="#f0f6fc" font-size="11">NAS 响应</text>
  <text x="620" y="399" fill="#7c4dff" font-size="11">→</text>
  <text x="635" y="399" fill="#f0f6fc" font-size="11">原路返回</text>

  <!-- Key point -->
  <rect x="200" y="430" width="560" height="50" rx="10" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
  <text x="480" y="452" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="700">NAS 完全不暴露公网 · 攻击面为零</text>
  <text x="480" y="470" text-anchor="middle" fill="#8b949e" font-size="11">所有流量经过 SSH 隧道加密，跳板机是唯一的公网入口</text>

  <!-- Legend -->
  <rect x="40" y="490" width="880" height="22" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <line x1="60" y1="501" x2="100" y2="501" stroke="#00d4ff" stroke-width="2"/>
  <text x="108" y="505" fill="#8b949e" font-size="10">用户请求</text>
  <line x1="180" y1="501" x2="220" y2="501" stroke="#7c4dff" stroke-width="2"/>
  <text x="228" y="505" fill="#8b949e" font-size="10">SSH 加密</text>
  <line x1="300" y1="501" x2="340" y2="501" stroke="#00ff88" stroke-width="2"/>
  <text x="348" y="505" fill="#8b949e" font-size="10">内网通信</text>
  <text x="820" y="505" fill="#48cae4" font-size="10" opacity="0.6">Port Forwarding Diagram</text>

</svg>